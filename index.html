<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of Raf Bradey F. Matoza — BS IT Cum Laude graduate (Mapúa University), Application Developer (React, Vite, Java, MySQL), University IT Instructor, and IEEE Conference Researcher." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    <title>Raf Bradey F. Matoza | Application Developer &amp; IT Specialist</title>
    <script>
      (function() {
        try {
          var savedVisual = localStorage.getItem('portfolio-visual-theme') || 'editorial-dossier';
          if (savedVisual === 'current') savedVisual = 'editorial-dossier';
          document.documentElement.setAttribute('data-theme', savedVisual);
          var savedColor = localStorage.getItem('portfolio-theme');
          if (!savedColor) {
            savedColor = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (savedColor === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Critical Boot Loader Styles (Zero White Flash // Hardware Accelerated) */
      #boot-loader {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--bg-primary, #0b0d0e);
        color: var(--text-primary, #f4f6f4);
        padding: 2rem;
        will-change: transform, opacity;
        transition: transform 600ms cubic-bezier(0.16, 1, 0.3, 1),
                    opacity 600ms cubic-bezier(0.16, 1, 0.3, 1);
        overflow: hidden;
      }
      #boot-loader.loader-exit {
        transform: translate3d(0, -100%, 0);
        opacity: 0.96;
      }
      .loader-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 1.5rem;
        max-width: 90vw;
      }
      .loader-monogram-wrap {
        position: relative;
        width: clamp(96px, 16vw, 150px);
        height: clamp(116px, 20vw, 180px);
      }
      .loader-svg {
        width: 100%;
        height: 100%;
        color: var(--accent-primary, #d8ff38);
        filter: drop-shadow(0 0 20px var(--accent-light, rgba(216, 255, 56, 0.25)));
      }
      .r-stroke {
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation: r-draw 900ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes r-draw {
        0% {
          stroke-dashoffset: 400;
          fill: transparent;
        }
        75% {
          stroke-dashoffset: 0;
          fill: transparent;
        }
        100% {
          stroke-dashoffset: 0;
          fill: var(--accent-light, rgba(216, 255, 56, 0.12));
        }
      }
      .loader-telemetry {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.4rem;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
      }
      .loader-title {
        font-size: clamp(13px, 2vw, 17px);
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--text-primary, #f4f6f4);
      }
      .loader-sub {
        font-size: clamp(10px, 1.3vw, 12px);
        color: var(--text-muted, #74837a);
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .loader-progress-track {
        width: clamp(140px, 22vw, 200px);
        height: 2px;
        background-color: var(--border-subtle, rgba(255, 255, 255, 0.1));
        overflow: hidden;
        border-radius: 9999px;
        margin-top: 0.4rem;
      }
      .loader-progress-fill {
        width: 100%;
        height: 100%;
        background-color: var(--accent-primary, #d8ff38);
        transform-origin: left;
        transform: scaleX(0);
        animation: progress-fill 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes progress-fill {
        0% { transform: scaleX(0); }
        100% { transform: scaleX(1); }
      }
      .loader-skip-hint {
        position: absolute;
        bottom: 2rem;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        color: var(--text-muted, #74837a);
        background: transparent;
        border: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.1));
        padding: 0.45rem 0.9rem;
        border-radius: 8px;
        cursor: pointer;
        transition: color 150ms ease, border-color 150ms ease;
      }
      .loader-skip-hint:hover {
        color: var(--text-primary, #f4f6f4);
        border-color: var(--border-strong, rgba(255, 255, 255, 0.3));
      }
      @media (prefers-reduced-motion: reduce) {
        .r-stroke {
          stroke-dashoffset: 0 !important;
          animation: none !important;
          fill: var(--accent-light, rgba(216, 255, 56, 0.12)) !important;
        }
        .loader-progress-fill {
          transform: scaleX(1) !important;
          animation: none !important;
        }
        #boot-loader {
          transition-duration: 150ms !important;
        }
      }
    </style>
    <script>
      (function() {
        // FORCE_LOADER: Set to true to view/test on every reload during development.
        // Set to false in production to enforce once-per-session (sessionStorage).
        var FORCE_LOADER = true;
        var isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        var shouldForce = FORCE_LOADER || isDev || window.location.search.indexOf('loader') !== -1;

        window.__FORCE_LOADER__ = shouldForce;

        var hasBooted = sessionStorage.getItem('raf_portfolio_booted');
        if (hasBooted && !shouldForce) {
          var hideStyle = document.createElement('style');
          hideStyle.textContent = '#boot-loader { display: none !important; }';
          document.head.appendChild(hideStyle);
          window.__LOADER_COMPLETED__ = true;
          return;
        }

        document.documentElement.style.overflow = 'hidden';

        var startTime = Date.now();
        var MIN_DURATION = 1400;
        var MAX_DURATION = 3500;
        var isExiting = false;

        function exitLoader() {
          if (isExiting) return;
          isExiting = true;

          var loaderEl = document.getElementById('boot-loader');
          if (!loaderEl) {
            document.documentElement.style.overflow = '';
            window.__LOADER_COMPLETED__ = true;
            window.dispatchEvent(new CustomEvent('portfolio-loader-complete'));
            return;
          }

          loaderEl.classList.add('loader-exit');
          sessionStorage.setItem('raf_portfolio_booted', 'true');
          document.documentElement.style.overflow = '';

          window.__LOADER_COMPLETED__ = true;
          window.dispatchEvent(new CustomEvent('portfolio-loader-complete'));

          setTimeout(function() {
            loaderEl.style.display = 'none';
            loaderEl.setAttribute('inert', '');
          }, 650);
        }

        // Allow skipping via skip button or keyboard after short grace period
        window.addEventListener('DOMContentLoaded', function() {
          var skipBtn = document.getElementById('loader-skip-btn');
          if (skipBtn) {
            skipBtn.addEventListener('click', function(e) {
              e.stopPropagation();
              exitLoader();
            });
          }
        });

        // Keyboard skip (Escape, Space, Enter, or any key)
        window.addEventListener('keydown', function() {
          exitLoader();
        }, { once: true });

        // Click to skip on background after 400ms grace period (prevents premature abort on window-focus click)
        setTimeout(function() {
          var loaderEl = document.getElementById('boot-loader');
          if (loaderEl) {
            loaderEl.addEventListener('click', exitLoader, { once: true });
          }
        }, 400);

        var fontsReady = document.fonts ? document.fonts.ready : Promise.resolve();
        var windowLoaded = new Promise(function(resolve) {
          if (document.readyState === 'complete') resolve();
          else window.addEventListener('load', resolve, { once: true });
        });

        Promise.all([fontsReady, windowLoaded]).then(function() {
          var elapsed = Date.now() - startTime;
          var remaining = Math.max(0, MIN_DURATION - elapsed);
          setTimeout(exitLoader, remaining);
        }).catch(function() {
          exitLoader();
        });

        setTimeout(exitLoader, MAX_DURATION);
      })();
    </script>
  </head>
  <body>
    <!-- Intentional Session Boot Loader (Concept A: Big 'R' Monogram) -->
    <div id="boot-loader" role="status" aria-live="polite" aria-label="Loading portfolio">
      <div class="loader-center">
        <div class="loader-monogram-wrap">
          <svg class="loader-svg" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path class="r-stroke" d="M25 105 V15 H60 C78 15 85 28 85 45 C85 60 76 72 58 74 L86 105 M25 55 H58" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="loader-telemetry">
          <span class="loader-title">RAF BRADEY F. MATOZA</span>
          <span class="loader-sub">INITIALIZING INTERFACE // 2026</span>
          <div class="loader-progress-track">
            <div class="loader-progress-fill"></div>
          </div>
        </div>
      </div>
      <button type="button" class="loader-skip-hint" id="loader-skip-btn" aria-label="Skip loading animation">
        [PRESS ANY KEY OR CLICK TO SKIP]
      </button>
    </div>
    <noscript>
      <style>
        #boot-loader { display: none !important; }
        html { overflow: auto !important; }
        .reveal-item,
        .animate-reveal {
          opacity: 1 !important;
          transform: none !important;
        }
        .section-divider-line {
          transform: scaleX(1) !important;
        }
      </style>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
