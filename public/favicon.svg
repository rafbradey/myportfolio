<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="phosphor-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d8ff38" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d8ff38" stop-opacity="0"/>
    </radialGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Basalt Terminal Container Tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0b0d0e"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#phosphor-glow)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#d8ff38" stroke-width="2" stroke-opacity="0.32"/>

  <!-- Live Terminal Status Node (Phosphor Green Dot) -->
  <circle cx="48" cy="16" r="2.5" fill="#d8ff38" opacity="0.9"/>

  <!-- Sharp Geometric 'R' Monogram (Raf Matoza Brand Identifier) -->
  <g filter="url(#subtle-glow)">
    <path
      d="M20 48 V16 H33.5 C42 16 46.5 19.5 46.5 24.5 C46.5 29.5 42 33 33.5 33 H20 M32 33 L45 48"
      stroke="#d8ff38"
      stroke-width="5.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>